name: Build Debug APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Clone Required Sibling Repo (release-tools)
        run: |
          git clone https://github.com/robmat/release-tools.git ../release-tools

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      # সম্পূর্ণ প্যাকেজ এসেম্বল করা
      - name: Build All Assemblies
        run: ./gradlew assemble --stacktrace

      # যেকোনো ধরনের আউটপুট ফাইল (.apk বা .aab) খুঁজে এক জায়গায় নিয়ে আসা
      - name: Collect Generated Outputs
        run: |
          mkdir -p apk_output
          echo "=== All files in app/build/outputs ==="
          find app/build/outputs -type f || true
          
          echo "=== Copying any APK or AAB found ==="
          find . -type f \( -name "*.apk" -o -name "*.aab" \) -exec cp {} apk_output/ \;
          
          echo "=== Collected Files ==="
          ls -la apk_output

      # ফাইল আপলোড করা
      - name: Upload Output Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ArrowEscape-Build-Output
          path: apk_output/*
          if-no-files-found: error
