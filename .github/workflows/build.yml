name: Build Debug APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Clone Required Sibling Repo (release-tools)
        run: |
          git clone https://github.com/robmat/release-tools.git ../release-tools

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      # শুধুমাত্র Debug APK তৈরি করার চূড়ান্ত নির্দেশ
      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-configuration-cache --stacktrace

      # তৈরি হওয়া APK ফাইল খুঁজে বের করে apk_output ফোল্ডারে কপি করা
      - name: Collect Generated APK
        run: |
          mkdir -p apk_output
          find app/build/outputs -type f -name "*.apk" -exec cp -v {} apk_output/ \; || true
          find . -type f -name "*.apk" -exec cp -v {} apk_output/ \; || true
          ls -la apk_output

      # ব্যবহারকারীর জন্য ডাউনলোড ফাইল আপলোড করা
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ArrowEscape-Debug-APK
          path: apk_output/
          if-no-files-found: error
