name: Build Debug APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-configuration-cache --stacktrace

      - name: Collect Generated APK
        run: |
          mkdir -p apk_output
          find /tmp/gradle-builds -name "*.apk" -type f -exec cp -v {} apk_output/ \; || true
          find /home/runner/work -name "*.apk" -type f -exec cp -v {} apk_output/ \; || true
          ls -la apk_output

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ArrowEscape-Debug-APK
          path: apk_output/*.apk
          if-no-files-found: error
