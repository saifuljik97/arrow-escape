name: Unpack Source Code

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download --pattern "*.zip" --dir .

      - name: Extract zip and arrange files
        run: |
          mkdir -p temp_extracted
          unzip -q *.zip -d temp_extracted
          SRC_DIR=$(find temp_extracted -maxdepth 2 -name "settings.gradle.kts" -exec dirname {} \;)
          if [ -n "$SRC_DIR" ]; then
            cp -r "$SRC_DIR"/. .
          else
            cp -r temp_extracted/. .
          fi
          rm -rf temp_extracted *.zip

      - name: Commit and push files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import source code from release zip"
          git push
