name: Build Debug APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Clone Required Sibling Repo (release-tools)
        run: |
          git clone https://github.com/robmat/release-tools.git ../release-tools

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      # সরাসরি :app মডিউলকে টার্গেট করে APK তৈরির নির্দেশ
      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      # তৈরি হওয়া APK ফাইল খুঁজে বের করে এক জায়গায় আনা
      - name: Collect Generated APK
        run: |
          mkdir -p apk_output
          echo "=== Searching for APK files ==="
          find . -name "*.apk" -type f -exec cp {} apk_output/ \;
          echo "=== Found files in apk_output ==="
          ls -la apk_output

      # ব্যবহারকারীর ডাউনলোডের জন্য আপলোড করা
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ArrowEscape-Debug-APK
          path: apk_output/*.apk
          if-no-files-found: error
