name: Build Debug APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Clone Required Sibling Repo (release-tools)
        run: |
          git clone https://github.com/robmat/release-tools.git ../release-tools

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-configuration-cache --stacktrace

      # app/build ফোল্ডারে কী কী ফাইল তৈরি হয়েছে তা পুরো খুঁজে দেখা
      - name: Find and Print All Generated Files
        run: |
          echo "=== 1. Checking outputs folder ==="
          ls -laR app/build/outputs || true
          
          echo "=== 2. Looking for all APK files ==="
          find app/build -type f -name "*.apk" || true
          
          echo "=== 3. Looking for all AAB files ==="
          find app/build -type f -name "*.aab" || true
          
          echo "=== 4. Listing all files inside app/build/outputs/apk ==="
          ls -laR app/build/outputs/apk || true
