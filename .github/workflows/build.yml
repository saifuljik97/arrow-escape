name: Build Debug APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      # এই প্রজেক্টের বিল্ড হওয়ার জন্য পাশে release-tools প্রজেক্টটি প্রয়োজন হয়
      - name: Clone Required Sibling Repo (release-tools)
        run: |
          git clone https://github.com/robmat/release-tools.git ../release-tools

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Skein-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
